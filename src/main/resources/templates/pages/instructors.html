<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giảng viên - EnglishPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<section class="page-banner">
    <div class="container">
        <span class="hero-badge">Expert Instructors</span>
        <h1>Đội ngũ giảng viên</h1>
        <p>
            Học cùng những giảng viên có kinh nghiệm luyện thi, đào tạo giao tiếp
            và giảng dạy tiếng Anh ứng dụng.
        </p>
    </div>
</section>

<section class="page-section">
    <div class="container">
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="instructor : ${instructors}">
                <div class="instructor-card text-center">
                    <img th:src="${instructor.avatar}"
                         th:alt="${instructor.name}"
                         class="instructor-avatar mb-3">

                    <h4 th:text="${instructor.name}">Ms. Anna Nguyen</h4>

                    <p class="text-danger fw-bold" th:text="${instructor.role}">
                        IELTS Speaking Mentor
                    </p>

                    <p class="text-secondary" th:text="${instructor.description}">
                        Mô tả giảng viên
                    </p>

                    <div class="course-meta justify-content-center">
                        <span th:text="${instructor.totalCourses}">12 khóa học</span>
                        <span th:text="${instructor.rating} + ' ⭐'">4.9 ⭐</span>
                    </div>

                    <a th:href="@{/courses}" class="btn btn-dark-soft mt-3">
                        Xem khóa học
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
