<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Đăng nhập</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
    <div class="container">
        <a class="navbar-brand logo" th:href="@{/}">
            English<span>Pro</span>
        </a>

        <div class="ms-auto">
            <a class="btn-red" th:href="@{/register}">Đăng ký</a>
        </div>
    </div>
</nav>

<section class="auth-section">
    <div class="container">
        <div class="auth-box">
            <div class="text-center mb-4">
                <span class="hero-badge">Welcome back</span>
                <h1 class="fw-bold mt-3">Đăng nhập</h1>
                <p class="text-secondary mb-0">Truy cập tài khoản để tiếp tục học tập</p>
            </div>

            <form>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="name@email.com">
                </div>

                <div class="mb-4">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" placeholder="Nhập mật khẩu">
                </div>

                <button type="submit" class="btn-red w-100">
                    Đăng nhập
                </button>

                <p class="text-center text-secondary mt-4 mb-0">
                    Chưa có tài khoản?
                    <a th:href="@{/register}" class="text-white fw-bold">Đăng ký ngay</a>
                </p>
            </form>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
