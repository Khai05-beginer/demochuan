<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loại khóa học - EnglishPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<section class="page-banner">
    <div class="container">
        <span class="hero-badge">Course Categories</span>
        <h1>Loại khóa học</h1>
        <p>
            Chọn nhóm khóa học phù hợp với mục tiêu học tiếng Anh của bạn:
            luyện thi, giao tiếp, công việc hoặc nền tảng học thuật.
        </p>
    </div>
</section>

<section class="page-section">
    <div class="container">
        <div class="row g-4">
            <div class="col-md-6 col-lg-3" th:each="category : ${categories}">
                <div class="category-card">
                    <!-- FIX: Entity dùng .field thay vì .field() -->
                    <div class="category-icon" th:text="${category.icon}">🎯</div>
                    <h4 th:text="${category.name}">IELTS</h4>
                    <p class="text-secondary" th:text="${category.description}">Mô tả loại khóa học</p>
                    <div class="course-meta">
                        <span th:text="${category.totalCourses}">12 khóa học</span>
                    </div>
                    <a th:href="@{/courses(category=${category.name})}" class="text-danger fw-bold">
                        Xem khóa học →
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
