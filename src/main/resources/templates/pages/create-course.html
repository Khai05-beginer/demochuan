<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm khóa học - EnglishPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="fragments/header :: header"></div>

<main class="page-wrapper">
    <section class="page-section">
        <div class="container">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-5">
                <div>
                    <span class="hero-badge">Course Management</span>
                    <h1 class="fw-bold display-5 mt-3">Thêm khóa học mới</h1>
                    <p class="text-secondary">
                        Form giao diện cho chức năng quản trị khóa học. Sau này sẽ nối với Controller, Service và MySQL.
                    </p>
                </div>

                <a th:href="@{/dashboard}" class="btn btn-dark-soft">Quay lại Dashboard</a>
            </div>

            <div class="admin-form">
                <form>
                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div class="mb-3">
                                <label class="form-label">Tên khóa học</label>
                                <input type="text" class="form-control" placeholder="Ví dụ: IELTS Speaking Masterclass">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mô tả ngắn</label>
                                <input type="text" class="form-control" placeholder="Mô tả ngắn hiển thị trên card khóa học">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mô tả chi tiết</label>
                                <textarea class="form-control" rows="7" placeholder="Nhập nội dung chi tiết khóa học..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Link ảnh khóa học</label>
                                <input type="text" class="form-control" placeholder="https://...">
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="mb-3">
                                <label class="form-label">Loại khóa học</label>
                                <select class="form-select">
                                    <option>IELTS</option>
                                    <option>TOEIC</option>
                                    <option>Giao tiếp</option>
                                    <option>Business English</option>
                                    <option>Grammar</option>
                                    <option>Writing</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Giảng viên</label>
                                <select class="form-select">
                                    <option>Ms. Anna Nguyen</option>
                                    <option>Mr. Minh Tran</option>
                                    <option>Ms. Linh Pham</option>
                                    <option>Mr. David Lee</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Cấp độ</label>
                                <select class="form-select">
                                    <option>Beginner</option>
                                    <option>Intermediate</option>
                                    <option>Advanced</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Giá bán</label>
                                <input type="number" class="form-control" placeholder="899000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Giá gốc</label>
                                <input type="number" class="form-control" placeholder="1299000">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select">
                                    <option>Đang bán</option>
                                    <option>Bản nháp</option>
                                    <option>Tạm ẩn</option>
                                </select>
                            </div>

                            <button type="button" class="btn btn-red w-100">Lưu khóa học</button>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </section>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
